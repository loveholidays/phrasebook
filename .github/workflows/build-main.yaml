name: Build and Stage

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout [main]
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install

      # Sets HAS_CHANGESETS output to "false" when there are no changesets available, so we can skip
      # building and staging when there were only documentation changes etc.
      - name: Check changesets
        id: changesets
        run: |
          npx changeset status
          if [ $? -ne 0 ]; then exit 1; fi
          npx changeset status --output status.json
          HAS_CHANGESETS=$(node -e "console.log(require('./status.json').changesets.length > 0)")
          rm -rf status.json
          echo "HAS_CHANGESETS=$HAS_CHANGESETS" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.changesets.outputs.HAS_CHANGESETS == 'true'
        run: npm run test

      - name: Update package versions
        if: steps.changesets.outputs.HAS_CHANGESETS == 'true'
        run: |
          npx changeset version
          npm install

      - name: Run build
        if: steps.changesets.outputs.HAS_CHANGESETS == 'true'
        run: npm run build

      - name: Commit version changes
        if: steps.changesets.outputs.HAS_CHANGESETS == 'true'
        run: |
          git config --global user.name "build-loveholidays" && git config --global user.email "build@loveholidays.com"
          git diff && git add .
          git commit -m "Update package versions"
          git push origin main

      - name: Install npm for trusted publishing
        if: steps.changesets.outputs.HAS_CHANGESETS == 'true'
        run: npm install --global 'npm@^11.15.0'

      - name: Stage package for approval
        if: steps.changesets.outputs.HAS_CHANGESETS == 'true'
        run: npm stage publish --access public --tag latest
